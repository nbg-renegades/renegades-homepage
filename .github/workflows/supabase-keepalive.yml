# Free-plan Supabase projects pause after ~7 days with no database activity, and a paused
# project stops resolving in DNS — which takes down all three contact forms and the results
# pages with them. A scheduled read of public.heartbeat supplies the activity that keeps the
# project awake.
#
# Kept deliberately, even though the results sync now writes to results_sync_state every
# minute and that is database activity in its own right. The sync is exactly what stops if
# LeagueSphere is unreachable for a week, a secret is rotated or the cron job is unscheduled
# — and that is precisely when the project would quietly drift towards a pause with nobody
# watching. One read a day is a rounding error against the Free-tier quota and it fails
# loudly, so it stays as the backstop rather than being retired on the assumption that
# something else covers it.
#
# Needs one repository secret: SUPABASE_URL is public and inlined below, but the anon key
# is kept in SUPABASE_ANON_KEY so rotating it does not require editing this file.

name: Supabase keepalive

on:
  schedule:
    # 04:17 UTC daily — an odd minute to stay off GitHub's busy top-of-hour queue, where
    # scheduled runs are dropped rather than delayed under load.
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query heartbeat table
        env:
          SUPABASE_URL: https://ekmdcqcjvodsnaqpsgun.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          status=$(curl -sS --max-time 30 -o response.txt -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/heartbeat?select=last_seen&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "HTTP $status"
          cat response.txt

          # A paused project fails DNS and curl exits non-zero before reaching here; a
          # revoked key returns 401. Either way the job must go red, because a silent
          # green run is exactly how the last outage went unnoticed.
          if [ "$status" != "200" ]; then
            echo "::error::Supabase keepalive failed with HTTP $status - the project may be paused or the anon key rotated."
            exit 1
          fi
