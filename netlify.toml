[build]
  command = "ng build"
  publish = "dist/demo/browser"

[[plugins]]
  package = "@netlify/angular-runtime"

# Apex -> www is handled by Netlify's own primary-domain redirect (Domain management),
# which runs ahead of both edge functions and redirect rules — a rule here never fires.

# Build output is content-hashed (outputHashing: all), so a new deploy produces new
# filenames and these can be cached indefinitely.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images and icons keep stable filenames, so they get a finite lifetime instead.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML is deliberately absent here: SSR responses set their own no-store header in
# server.ts, and Netlify does not document how overlapping header rules resolve.

# A deploy preview answers on its own Netlify hosts, which the SSR host check in
# server.ts rejects unless they are compiled in. Only preview builds get them;
# production keeps the empty list from angular.json.
[context.deploy-preview]
  command = 'ng build --define "PREVIEW_HOSTS=[\"${DEPLOY_PRIME_URL#https://}\",\"${DEPLOY_URL#https://}\"]"'
