# Supabase project config. Committed on purpose: it holds no secrets (function secrets
# live in `supabase secrets set`), and without it a fresh clone has no record of which
# functions exist or how they are served.

project_id = "ekmdcqcjvodsnaqpsgun"

# verify_jwt is the CLI default, but stated explicitly because the forms depend on it:
# supabase-js attaches the anon key as a bearer token on functions.invoke(), so these
# stay reachable from the browser while refusing requests with no key at all.

[functions.send-contact-email]
verify_jwt = true

[functions.send-tryout-email]
verify_jwt = true

[functions.send-membership-application]
verify_jwt = true

# The results sync is not a form: nothing in the browser may trigger it. verify_jwt keeps the
# gateway from passing anonymous calls through, but the anon key is public and ships in this
# site's bundle, so it is not the real gate — the function additionally requires the
# x-cron-secret header, which lives only in Vault and in the function's own secrets. Without
# that, anyone could burn the hourly LeagueSphere budget and leave the results page stale.
[functions.sync-leaguesphere]
verify_jwt = true
